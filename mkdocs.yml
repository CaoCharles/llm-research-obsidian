# MkDocs 專案設定 - LLM Paper Daily Digest

site_name: LLM Paper Daily Digest
site_description: Daily LLM paper digests from arXiv with structured summaries
site_author: Charles Cao
site_url: https://CaoCharles.github.io/llm-research-obsidian/

repo_name: CaoCharles/llm-research-obsidian
repo_url: https://github.com/CaoCharles/llm-research-obsidian
edit_uri: ""

docs_dir: docs
site_dir: site

# Hooks - 自動生成 content.json
hooks:
  - .agent/skills/chatbot-setup/assets/generate_content.py

theme:
  name: material
  language: zh-TW
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: Asia/Taipei
      locale: zh
  - git-authors
  - mkdocs-pdf
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/marked/marked.min.js
  - assets/js/chatbot.js

extra_css:
  - assets/css/extra.css
  - assets/css/chatbot.css

nav:
  - 首頁: index.md
  - 每日摘要:
      - Daily/index.md
      - 2026-02-05: Daily/2026-02-05.md
      - 2026-02-04: Daily/2026-02-04.md
  - AI Agent:
      - Agent 總覽: Topics/agent.md
      - Agent 評測: Topics/agent-evaluation.md
      - Agent 基準測試: Topics/agent-benchmark.md
      - Agentic RAG: Topics/agentic-rag.md
      - 具身智能: Topics/embodied-ai.md
  - 安全與對齊:
      - 安全總覽: Topics/safety.md
      - 對齊研究: Topics/alignment.md
      - RLHF: Topics/rlhf.md
      - Prompt 注入: Topics/prompt-injection.md
      - 對抗魯棒性: Topics/adversarial-robustness.md
      - 認證防禦: Topics/certified-defense.md
      - 多模態安全: Topics/multimodal-safety.md
  - 幻覺與事實:
      - 幻覺總覽: Topics/hallucination.md
      - 幻覺檢測: Topics/hallucination-detection.md
      - 幻覺緩解: Topics/hallucination-mitigation.md
      - 事實性: Topics/factuality.md
      - 忠實推理: Topics/faithful-reasoning.md
  - RAG 與評測:
      - RAG 評測: Topics/rag-evaluation.md
      - 基準測試: Topics/benchmark.md
      - LLM-as-Judge: Topics/llm-as-judge.md
  - 多模態:
      - VLM: Topics/vlm.md
      - Omni 模型: Topics/omni-models.md
      - 多模態推理: Topics/multimodal-reasoning.md
  - 論文庫:
      - Papers/index.md
