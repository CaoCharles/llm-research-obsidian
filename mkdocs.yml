# MkDocs 專案設定 - LLM 評測知識庫

site_name: LLM 評測知識庫
site_description: LLM 評測策略、基準測試與安全評估的完整指南
site_author: Charles Cao
site_url: https://CaoCharles.github.io/llm-research-obsidian/

repo_name: CaoCharles/llm-research-obsidian
repo_url: https://github.com/CaoCharles/llm-research-obsidian
edit_uri: ""

docs_dir: docs
site_dir: site

# Hooks - 自動生成 content.json
hooks:
  - .agent/skills/chatbot-setup/assets/generate_content.py

theme:
  name: material
  language: zh-TW
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: datetime
      timezone: Asia/Taipei
      locale: zh
  - git-authors
  - mkdocs-pdf
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/marked/marked.min.js
  - assets/js/chatbot.js

extra_css:
  - assets/css/extra.css
  - assets/css/chatbot.css

nav:
  - 首頁: index.md
  - 評測策略與框架:
      - 概述: Evaluation-Framework/index.md
      - 評估指標:
          - 準確率: Evaluation-Framework/metrics-accuracy.md
          - 相關性: Evaluation-Framework/metrics-relevance.md
          - 真實性: Evaluation-Framework/metrics-faithfulness.md
          - 一致性: Evaluation-Framework/metrics-consistency.md
      - Responsible AI:
          - 概述: Evaluation-Framework/responsible-ai.md
          - 公平性驗收: Evaluation-Framework/fairness.md
          - 偏見檢測: Evaluation-Framework/bias-detection.md
          - 可解釋性: Evaluation-Framework/explainability.md
  - 基準測試與數據治理:
      - 概述: Benchmark-Governance/index.md
      - 測試集設計:
          - 黃金測試集: Benchmark-Governance/golden-testset.md
          - 數據生命週期: Benchmark-Governance/dataset-lifecycle.md
          - 關鍵路徑覆蓋: Benchmark-Governance/critical-path.md
          - 邊緣案例: Benchmark-Governance/edge-cases.md
          - 對抗性樣本: Benchmark-Governance/adversarial-samples.md
      - 評測工具:
          - RAGAS: Benchmark-Governance/tools-ragas.md
          - DeepEval: Benchmark-Governance/tools-deepeval.md
          - Arize Phoenix: Benchmark-Governance/tools-arize.md
  - 安全性與紅隊演練:
      - 概述: Security-RedTeam/index.md
      - AI 安全防護: Security-RedTeam/ai-security.md
      - 紅隊演練指南: Security-RedTeam/red-teaming-guide.md
      - 攻擊向量清單: Security-RedTeam/attack-vectors.md
      - 威脅防禦策略:
          - Prompt Injection: Security-RedTeam/defense-prompt-injection.md
          - Jailbreaking: Security-RedTeam/defense-jailbreaking.md
          - PII 洩露防護: Security-RedTeam/defense-pii.md
      - 壓力測試: Security-RedTeam/stress-testing.md
  - 論文庫: Papers/index.md

