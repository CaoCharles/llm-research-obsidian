[project]
name = "lpdd"
version = "0.1.0"
description = "LLM Paper Daily Digest - Obsidian 版自動化論文摘要系統"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.6.2",
    "requests>=2.32.0",
]

[project.scripts]
lpdd = "main:main"
