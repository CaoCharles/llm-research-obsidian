[project]
name = "llm-paper-obsidian-site"
version = "0.1.0"
description = "MkDocs tooling for LLM Paper Daily Digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mkdocs-material>=9.5.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-git-authors-plugin>=0.7.0",
    "mkdocs-pdf>=0.1.2",
    "mkdocs-roamlinks-plugin>=0.3.1",
    "arize-phoenix==12.33.1",
    "arize-phoenix-evals==2.9.0",
    "openai>=2.17.0",
    "pypdf>=6.6.2",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.0",
    "numpy>=2.4.2",
    "dotenv>=0.9.9",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "deepeval==3.8.4",
    "ragas==0.4.3",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_paper_obsidian_site"]
