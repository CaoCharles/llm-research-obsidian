name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build MkDocs site
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/llm-paper-obsidian-mkdocs-venv
        run: |
          python scripts/sync_docs.py
          uv sync --project .agent/skills/mkdocs-setup/assets --locked --no-install-project
          uv run --project .agent/skills/mkdocs-setup/assets --no-sync mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
