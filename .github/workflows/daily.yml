name: Daily paper digest

on:
  schedule:
    # GitHub Actions cron uses UTC: 00:00 UTC = 08:00 Asia/Taipei.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD; blank means today)"
        required: false
        type: string
      top_n:
        description: "Number of papers to analyze"
        required: false
        default: "10"
        type: string
      lookback_days:
        description: "Calendar days included in one arXiv query"
        required: false
        default: "7"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      OBSIDIAN_VAULT_PATH: ${{ github.workspace }}
      TZ: Asia/Taipei
      TOP_N: ${{ inputs.top_n || '10' }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
      DIGEST_DATE: ${{ inputs.date || '' }}
      ARXIV_MAX_ATTEMPTS: "8"
      ARXIV_RETRY_BASE_SECONDS: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch, summarize, sync, and build
        run: bash scripts/daily_run.sh "${DIGEST_DATE:-$(date +%F)}"

      - name: Commit and push automation output
        run: |
          git add -- Daily DailyJSON Papers Topics
          if git diff --cached --quiet; then
            echo "No new digest content to push."
            exit 0
          fi
          git commit -m "daily digest ${DIGEST_DATE:-$(date +%F)}"
          git pull --rebase origin main
          git push origin HEAD:main
