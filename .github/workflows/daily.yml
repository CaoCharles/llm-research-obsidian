name: Daily paper digest

on:
  schedule:
    # GitHub Actions cron uses UTC: 00:00 UTC = 08:00 Asia/Taipei.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD; blank means today)"
        required: false
        type: string
      top_n:
        description: "Number of papers to analyze"
        required: false
        default: "10"
        type: string
      lookback_days:
        description: "Calendar days included in one arXiv query"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      OBSIDIAN_VAULT_PATH: ${{ github.workspace }}
      TZ: Asia/Taipei
      TOP_N: ${{ inputs.top_n || '10' }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
      DIGEST_DATE: ${{ inputs.date || '' }}
      AUTOMATION_BRANCH: automation/paper-digest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare automation branch
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$AUTOMATION_BRANCH" >/dev/null; then
            git fetch origin "$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          fi
          git switch -C "$AUTOMATION_BRANCH" origin/main

      - name: Fetch, summarize, sync, and build
        run: bash scripts/daily_run.sh "${DIGEST_DATE:-$(date +%F)}"

      - name: Commit automation output
        id: commit
        run: |
          git add -- Daily DailyJSON Papers Topics
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "daily digest ${DIGEST_DATE:-$(date +%F)}"
          git push --force-with-lease --set-upstream origin "$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update digest pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          if gh pr list --head "$AUTOMATION_BRANCH" --base main --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "Automated paper digest updates" \
              --body "Automated arXiv paper digest updates. Review the generated summaries before merging."
          else
            echo "Existing digest pull request updated."
          fi
