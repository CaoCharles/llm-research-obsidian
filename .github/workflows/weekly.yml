name: Weekly paper digest

on:
  schedule:
    # 00:37 UTC Monday = 08:37 Monday in Asia/Taipei.
    - cron: "37 0 * * 1"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Last date included (YYYY-MM-DD; blank means yesterday)"
        required: false
        type: string
      days:
        description: "Number of calendar days to aggregate"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-paper-digest
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Taipei
      END_DATE: ${{ inputs.end_date || '' }}
      DAYS: ${{ inputs.days || '7' }}
      AUTOMATION_BRANCH: automation/weekly-digest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare automation branch
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$AUTOMATION_BRANCH" >/dev/null; then
            git fetch origin "$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          fi
          git switch -C "$AUTOMATION_BRANCH" origin/main

      - name: Build weekly digest
        run: |
          effective_end_date="${END_DATE:-$(date -d yesterday +%F)}"
          python scripts/build_weekly_digest.py \
            --end-date "$effective_end_date" \
            --days "$DAYS" \
            --skip-empty

      - name: Commit weekly digest
        id: commit
        run: |
          git add -- Weekly
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "weekly digest $(date +%G-W%V)"
          git push --force-with-lease --set-upstream origin "$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update weekly pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          if gh pr list --head "$AUTOMATION_BRANCH" --base main --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "Automated weekly paper digest" \
              --body "Automated seven-day research digest. Review the generated weekly summary before merging."
          else
            echo "Existing weekly digest pull request updated."
          fi
